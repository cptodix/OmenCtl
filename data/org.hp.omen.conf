<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.hp.omen"/>
    <allow send_destination="org.hp.omen"/>
  </policy>
  <!-- Allow the dynamic user to own the dbus name -->
  <policy user="omen-space-daemon">
    <allow own="org.hp.omen"/>
  </policy>
  <policy context="default">
    <allow receive_sender="org.hp.omen"/>
  </policy>
  <!-- Allow users in omen-hw group to communicate with the daemon -->
  <policy group="omen-hw">
    <allow send_destination="org.hp.omen"/>
    <allow receive_sender="org.hp.omen"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="org.hp.omen"/>
    <allow receive_sender="org.hp.omen"/>
  </policy>
  <policy group="sudo">
    <allow send_destination="org.hp.omen"/>
    <allow receive_sender="org.hp.omen"/>
  </policy>
  <policy group="adm">
    <allow send_destination="org.hp.omen"/>
    <allow receive_sender="org.hp.omen"/>
  </policy>
</busconfig>
